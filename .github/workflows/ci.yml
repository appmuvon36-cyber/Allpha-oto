name: OtoClinic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otoclinic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-only
        run: npm run build

  api:
    name: API contracts and Phase 05 database transaction tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otoclinic_phase05_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d otoclinic_phase05_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otoclinic_phase05_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Health endpoint smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json()["service"] == "otoclinic-api"
          PY
      - name: Phase 05 mutation contracts
        run: python -m unittest discover -s tests -v
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare disposable Phase 05 database fixture
        run: |
          for attempt in $(seq 1 30); do
            pg_isready -d "$DATABASE_URL" && break
            sleep 2
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase05_db_fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018163123_phase05_idempotency_payload_binding.sql
      - name: Verify Phase 05 atomicity, audit, and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase05_db_assertions.sql
      - name: Verify concurrent retries are serialized
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase05_concurrent_call.sql > /tmp/phase05-retry-a.log &
          first=$!
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase05_concurrent_call.sql > /tmp/phase05-retry-b.log &
          second=$!
          wait "$first"
          wait "$second"
          products=$(psql "$DATABASE_URL" -Atqc "select count(*) from public.products where sku='PHASE05-CONCURRENT-1'")
          audits=$(psql "$DATABASE_URL" -Atqc "select count(*) from public.audit_logs where request_id='phase05-concurrent-retry-01'")
          test "$products" = "1"
          test "$audits" = "1"
      - name: Apply Phase 06 supplier migrations to disposable database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018170151_phase06_supplier_sourcing.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018170351_phase06_supplier_rpc_actor_guards.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018170609_phase06_supplier_review_read_policies.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018170904_phase06_active_owner_rls_hardening.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018170953_phase06_supplier_mutation_rpc_only.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018171044_phase06_supplier_document_expiry_guards.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018171304_phase06_offer_candidate_matching.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261018171341_phase06_offer_candidate_link_mutation.sql
      - name: Verify Phase 06 onboarding, document review, sourcing and audit
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase06_db_assertions.sql
      - name: Apply Phase 07 inventory and order lifecycle migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019002354_phase07_inventory_order_lifecycle.sql
      - name: Apply Phase 07 reservation expiry migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003036_phase07_reservation_expiry.sql
      - name: Apply Phase 07 transaction foreign-key indexes
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003253_phase07_transaction_fk_indexes.sql
      - name: Apply Phase 07 idempotency RLS guard
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003323_phase07_idempotency_rls_guard.sql
      - name: Apply Phase 07 checkout address bounds
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003442_phase07_checkout_address_bounds.sql
      - name: Apply Phase 07 shipping fee guard
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003521_phase07_shipping_fee_guard.sql
      - name: Apply Phase 07 cancelled-payment cleanup
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019003958_phase07_cancel_pending_payment_cleanup.sql
      - name: Verify Phase 07 atomic stock, checkout, payment, fulfillment, return and refund
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase07_db_assertions.sql
      - name: Prepare Phase 08 profile metadata on disposable database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter table public.user_profiles add column if not exists display_name text"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter table public.user_profiles add column if not exists created_at timestamptz not null default now()"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter table public.user_profiles add column if not exists updated_at timestamptz not null default now()"
      - name: Add product shipping weight for EC-02
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019070000_ec02_product_shipping_weight.sql
      - name: Apply EC-02 signed shipping quote checkout migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019081000_ec02_signed_shipping_quote_checkout.sql
      - name: Apply EC-02 checkout quote weight binding migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019120000_ec02_checkout_quote_weight_binding.sql
      - name: Verify EC-02 quote weight matches transactional order items
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/ec02_shipping_quote_assertions.sql
      - name: Apply EC-03 WhatsApp order handoff migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019150000_ec03_whatsapp_order_handoff.sql
      - name: Verify EC-03 handoff schema and grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/ec03_whatsapp_handoff_assertions.sql
      - name: Apply Phase 08 admin role management migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../supabase/migrations/20261019010200_phase08_admin_role_management.sql
      - name: Verify Phase 08 role change, audit and idempotency
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/phase08_db_assertions.sql
