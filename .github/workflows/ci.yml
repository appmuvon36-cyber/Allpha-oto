name: OtoClinic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otoclinic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-only
        run: npm run build

  api:
    name: API syntax and health smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Health endpoint smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json()["service"] == "otoclinic-api"
          PY
      - name: Phase 05 mutation contracts
        run: python -m unittest discover -s tests -v
